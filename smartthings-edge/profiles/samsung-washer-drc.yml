name: samsung-washer-drc
components:
  - id: main
    capabilities:
      - id: washerOperatingState
        version: 1
      - id: perfectforest07855.washerRemainingTime
        version: 1
      - id: perfectforest07855.washerProgramme
        version: 1
      - id: perfectforest07855.washerTemperature
        version: 1
      - id: perfectforest07855.washerSpin
        version: 1
      - id: perfectforest07855.washerRinse
        version: 1
      - id: remoteControlStatus
        version: 1
      - id: perfectforest07855.washerChildLock
        version: 1
      - id: perfectforest07855.washerDispenser
        version: 1
      - id: perfectforest07855.washerAlerts
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: Washer
metadata:
  ocfDeviceType: oic.d.washer
  # capabilities/device-config.json: one line on the tile (phase · % · time), controls first, maintenance last
  vid: c3eb2467-d348-3b12-85c3-b59739e4c268
  mnmn: SmartThingsCommunity
preferences:
  - name: ipAddress
    title: "Washer IP address (optional)"
    description: "Leave empty: the washer is found automatically"
    required: false
    preferenceType: string
    definition:
      stringType: text
  - name: pollSeconds
    title: "Polling interval (s)"
    required: false
    preferenceType: integer
    definition:
      minimum: 10
      maximum: 600
      default: 30
  - name: pairNow
    title: "Pair now"
    description: "Turn on, then turn Smart Control off and on again at the washer within 3 minutes"
    required: false
    preferenceType: boolean
    definition:
      default: false
